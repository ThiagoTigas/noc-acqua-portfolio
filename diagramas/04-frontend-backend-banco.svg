<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Frontend, backend e banco de dados</title>
  <desc id="descricao">Diagrama simplificado das três camadas: módulos do frontend, grupos de API e domínios persistidos no PostgreSQL isolado.</desc>
