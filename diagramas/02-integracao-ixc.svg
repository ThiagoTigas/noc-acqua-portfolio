<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="titulo descricao">
  <title id="titulo">Fluxo de integração com o IXC</title>
  <desc id="descricao">Diagrama simplificado da sincronização periódica: agendador, serviço de sincronização, coleta paginada somente leitura, normalização e gravação atômica; falhas preservam o snapshot anterior.</desc>
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#070d15"/>
      <stop offset="0.6" stop-color="#0a131e"/>
      <stop offset="1" stop-color="#0e1a27"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.82" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#3fd6e0" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3fd6e0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grade" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="rgba(148, 176, 206, 0.13)" stroke-width="1"/>
    </pattern>
    <marker id="ponta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9Z" fill="#3fd6e0"/>
    </marker>
    <marker id="pontaFraca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9Z" fill="#6b8094"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#fundo)"/>
  <rect width="1600" height="900" fill="url(#halo)"/>
  <rect width="1600" height="900" fill="url(#grade)" opacity="0.5"/>
  <text x="96" y="72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="3.2" fill="#3fd6e0">INTEGRAÇÃO · IXC</text>
  <text x="96" y="142" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-1.2" fill="#e9f1f8">Integração com o IXC</text>
  <text x="96" y="184" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18" fill="#a9bccd">Coleta periódica, validação e gravação atômica — sem escrita no sistema de origem.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.4">
    <rect x="1240" y="52" width="264" height="34" rx="17" fill="rgba(63,214,224,0.10)" stroke="#3fd6e0" stroke-opacity="0.35"/>
    <circle cx="1262" cy="69" r="4" fill="#3fd6e0"/>
    <text x="1278" y="73" fill="#3fd6e0">IMPLEMENTADO · V1.0.0</text>
  </g>
  <rect x="96" y="212" width="1408" height="1" fill="rgba(148, 176, 206, 0.13)"/>
  <g>
    <rect x="96" y="268" width="420" height="88" rx="18" fill="#0e1a27" stroke="rgba(148, 176, 206, 0.24)"/>
    <rect x="96" y="268" width="4" height="88" rx="2" fill="#3fd6e0" fill-opacity="0.7"/>
    <text x="120" y="308" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#e9f1f8">01 · Agendador</text>
    
    <text x="120" y="334" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#a9bccd">Disparo periódico configurável</text>
  </g>
  <g>
    <rect x="96" y="376" width="420" height="88" rx="18" fill="#0e1a27" stroke="rgba(148, 176, 206, 0.24)"/>
    <rect x="96" y="376" width="4" height="88" rx="2" fill="#3fd6e0" fill-opacity="0.7"/>
    <text x="120" y="416" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#e9f1f8">02 · Serviço de sincronização</text>
    
    <text x="120" y="442" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#a9bccd">Plano, checkpoint e janela operacional</text>
  </g>
  <g>
    <rect x="96" y="484" width="420" height="88" rx="18" fill="#0e1a27" stroke="rgba(148, 176, 206, 0.24)"/>
    <rect x="96" y="484" width="4" height="88" rx="2" fill="#3fd6e0" fill-opacity="0.7"/>
    <text x="120" y="524" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#e9f1f8">03 · Coleta no IXC</text>
    
    <text x="120" y="550" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#a9bccd">Somente leitura, paginada</text>
  </g>
  <g>
    <rect x="96" y="592" width="420" height="88" rx="18" fill="#0e1a27" stroke="rgba(148, 176, 206, 0.24)"/>
    <rect x="96" y="592" width="4" height="88" rx="2" fill="#3fd6e0" fill-opacity="0.7"/>
    <text x="120" y="632" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#e9f1f8">04 · Normalização e validação</text>
    
    <text x="120" y="658" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#a9bccd">Datas, status, técnicos e setores</text>
  </g>
  <g>
    <rect x="96" y="700" width="420" height="88" rx="18" fill="#0e1a27" stroke="rgba(148, 176, 206, 0.24)"/>
    <rect x="96" y="700" width="4" height="88" rx="2" fill="#3fd6e0" fill-opacity="0.7"/>
    <text x="120" y="740" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#e9f1f8">05 · Gravação atômica</text>
    
    <text x="120" y="766" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#a9bccd">O snapshot só é publicado completo</text>
  </g>
  <g aria-hidden="true">
    <path d="M306 356L306 376" fill="none" stroke="#3fd6e0" stroke-width="1.6" marker-end="url(#ponta)"/>
    
  </g>
  <g aria-hidden="true">
    <path d="M306 464L306 484" fill="none" stroke="#3fd6e0" stroke-width="1.6" marker-end="url(#ponta)"/>
    
  </g>
  <g aria-hidden="true">
    <path d="M306 572L306 592" fill="none" stroke="#3fd6e0" stroke-width="1.6" marker-end="url(#ponta)"/>
    
  </g>
  <g aria-hidden="true">
    <path d="M306 680L306 700" fill="none" stroke="#3fd6e0" stroke-width="1.6" marker-end="url(#ponta)"/>
    
  </g>
  <g>
    <rect x="620" y="560" width="420" height="228" rx="18" fill="#0e1a27" stroke="rgba(148, 176, 206, 0.24)"/>
    <rect x="620" y="560" width="4" height="228" rx="2" fill="#3fd6e0" fill-opacity="0.7"/>
    <text x="644" y="600" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#e9f1f8">Base persistida</text>
    
    <text x="644" y="626" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#a9bccd">Importações e cabeçalhos</text>
    <text x="644" y="650" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#a9bccd">Presença de O.S. e histórico</text>
    <text x="644" y="674" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#a9bccd">Checkpoints e cobertura</text>
    <text x="644" y="698" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#a9bccd">Autoria de Suporte N2</text>
  </g>
  <g aria-hidden="true">
    <path d="M516 744L620 744" fill="none" stroke="#3fd6e0" stroke-width="1.6" marker-end="url(#ponta)"/>
    <text x="568" y="734" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.8" fill="#6b8094">grava</text>
  </g>
  <g>
    <rect x="1120" y="560" width="384" height="228" rx="18" fill="#0e1a27" stroke="rgba(148, 176, 206, 0.24)"/>
    <rect x="1120" y="560" width="4" height="228" rx="2" fill="#3fd6e0" fill-opacity="0.7"/>
    <text x="1144" y="600" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#e9f1f8">Painéis, relatórios e assistente</text>
    
    <text x="1144" y="626" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#a9bccd">Consultam agregados com</text>
    <text x="1144" y="650" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#a9bccd">proveniência e critério</text>
  </g>
  <g aria-hidden="true">
    <path d="M1040 674L1120 674" fill="none" stroke="#3fd6e0" stroke-width="1.6" marker-end="url(#ponta)"/>
    <text x="1080" y="664" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="0.8" fill="#6b8094">consulta</text>
  </g>
  <g>
    <rect x="1120" y="268" width="384" height="228" rx="18" fill="#0e1a27" stroke="rgba(148, 176, 206, 0.24)"/>
    <rect x="1120" y="268" width="4" height="228" rx="2" fill="#f0c26b" fill-opacity="0.7"/>
    <text x="1144" y="308" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="600" fill="#e9f1f8">Falha ou coleta parcial</text>
    <text x="1484" y="298" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.2" fill="#f0c26b">PROTEÇÃO</text>
    <text x="1144" y="356" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#a9bccd">Snapshot anterior mantido</text>
    <text x="1144" y="380" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#a9bccd">Erro registrado</text>
    <text x="1144" y="404" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14" fill="#a9bccd">Nada parcial é publicado</text>
  </g>
  <g>
    <rect x="620" y="268" width="420" height="228" rx="16" fill="#122131" stroke="rgba(148, 176, 206, 0.13)"/>
    <rect x="620" y="268" width="420" height="3" rx="1.5" fill="#3fd6e0"/>
    <text x="644" y="306" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" fill="#e9f1f8">Limites declarados</text>
    <text x="644" y="336" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#a9bccd">A atualização não é instantânea:</text>
    <text x="644" y="358" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#a9bccd">depende do intervalo configurado.</text>
    <text x="644" y="380" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#a9bccd">Ausência na origem não apaga histórico:</text>
    <text x="644" y="402" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" fill="#a9bccd">vira ausência observada.</text>
  </g>
  <rect x="96" y="824" width="1408" height="1" fill="rgba(148, 176, 206, 0.13)"/>
  <text x="96" y="856" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.8" fill="#6b8094">Fonte: serviço de sincronização e cliente de leitura do IXC (V1.0.0).</text>
  <text x="1504" y="856" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.8" fill="#8196aa">MATERIAL DE APRESENTAÇÃO · SEM DADOS OPERACIONAIS</text>
  <rect x="0" y="897" width="1600" height="3" fill="#3fd6e0" opacity="0.3"/>
</svg>
